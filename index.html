<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천안 이봉주 마라톤대회</title><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0e1f33;color:#fff;font-family:Arial,"Malgun Gothic",sans-serif;display:flex;flex-direction:column}.header{padding:13px 20px;display:flex;justify-content:space-between;gap:10px;align-items:center}.header small{color:#a8bacb}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}.canvas{width:min(100%,calc((100dvh - 145px)*16/9));aspect-ratio:16/9;position:relative;overflow:hidden;background:#f4f6f9;border-radius:7px;box-shadow:0 10px 35px #0007}.canvas>img{display:block;width:100%;height:100%;object-fit:contain}.movieArea{display:none;position:absolute;left:53.5%;top:35.1%;width:40.8%;height:51.5%;background:#102942}.movieArea video{width:100%;height:100%;object-fit:cover}.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;flex-wrap:wrap}button{cursor:pointer}button.nav{background:#24465e;border:1px solid #54758b;border-radius:8px;color:white;padding:10px 16px}button:disabled{opacity:.35;cursor:default}.dots{display:flex;gap:7px}.dot{height:10px;width:10px;border-radius:50%;border:0;background:#657b8f;padding:0}.dot.on{background:#60d2d5;width:25px;border-radius:9px}#count{min-width:48px;text-align:center;font-size:13px;color:#c2d3df}.hint{text-align:center;color:#9cabb9;font-size:11px;padding:0 0 10px}@media(max-width:700px){.header small,.hint{display:none}.header{padding:10px}.stage{padding:3px}.canvas{width:100%}.controls{gap:7px;padding:10px 4px}button.nav{padding:8px}}</style></head><body><header class="header"><strong>천안 이봉주 마라톤대회</strong><small>2026 CHEONAN · MARATHON</small></header><main class="stage"><section class="canvas" aria-label="마라톤 발표자료"><img id="current" src="assets/slide-1.png" alt="발표자료 1 / 6"><div class="movieArea" id="movieArea"><video id="movie" controls playsinline preload="metadata" poster="assets/video-poster.jpg"><source src="assets/marathon.mp4" type="video/mp4">브라우저가 MP4 재생을 지원하지 않습니다.</video></div></section></main><nav class="controls" aria-label="슬라이드 이동"><button type="button" class="nav" id="prev">← 이전</button><div class="dots" id="dots"></div><span id="count">1 / 6</span><button type="button" class="nav" id="next">다음 →</button><button type="button" class="nav" id="full">전체 화면</button></nav><div class="hint">좌우 화살표 · 모바일 스와이프 · 6번째 슬라이드에서 영상 재생</div><div id="slideAssets" hidden><img src="assets/slide-1.png" alt=""><img src="assets/slide-2.png" alt=""><img src="assets/slide-3.png" alt=""><img src="assets/slide-4.png" alt=""><img src="assets/slide-5.png" alt=""><img src="assets/slide-6.png" alt=""></div><script>(function(){"use strict";const images=Array.from(document.querySelectorAll("#slideAssets img"));const target=document.getElementById("current");const area=document.getElementById("movieArea");const video=document.getElementById("movie");const dots=document.getElementById("dots");const count=document.getElementById("count");const prev=document.getElementById("prev");const next=document.getElementById("next");let index=0;images.forEach((_,i)=>{let b=document.createElement("button");b.type="button";b.className="dot";b.title=(i+1)+"번 슬라이드";b.setAttribute("aria-label",b.title);b.addEventListener("click",()=>show(i));dots.appendChild(b)});function show(i){if(i<0||i>=images.length)return;video.pause();index=i;target.src=images[i].src;target.alt="발표자료 "+(i+1)+" / 6";area.style.display=i===5?"block":"none";count.textContent=(i+1)+" / 6";prev.disabled=i===0;next.disabled=i===5;Array.from(dots.children).forEach((b,j)=>b.classList.toggle("on",j===i))}prev.addEventListener("click",()=>show(index-1));next.addEventListener("click",()=>show(index+1));document.getElementById("full").addEventListener("click",()=>{const el=document.querySelector(".canvas");if(document.fullscreenElement){document.exitFullscreen()}else if(el.requestFullscreen){el.requestFullscreen()}});document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&e.code==="Space")return;if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();show(index+1)}if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(index-1)}});let start=null;document.querySelector(".canvas").addEventListener("touchstart",e=>{start=e.changedTouches[0].clientX},{passive:true});document.querySelector(".canvas").addEventListener("touchend",e=>{if(start===null)return;let diff=e.changedTouches[0].clientX-start;if(Math.abs(diff)>55)show(index+(diff<0?1:-1));start=null},{passive:true});show(0)})();</script></body></html>
